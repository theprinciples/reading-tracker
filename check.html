<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>저장소 진단</title>
<style>
  :root { --bg:#faf6ee; --card:#fff; --ink:#3a3222; --line:#e8dfc8; --green:#2a9d5c; --red:#e0405a; --yellow:#c98a00; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .verdict { border-radius:14px; padding:16px; font-size:16px; font-weight:700; margin-bottom:14px; border:2px solid var(--line); background:var(--card); }
  .verdict.ok { border-color:var(--green); color:var(--green); }
  .verdict.bad { border-color:var(--red); color:var(--red); }
  .verdict.wait { border-color:var(--yellow); color:var(--yellow); }
  .verdict .sub { display:block; font-size:13px; font-weight:400; color:var(--ink); margin-top:6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .row .k { color:#8a7d5e; flex-shrink:0; }
  .row .v { text-align:right; word-break:break-all; font-weight:600; }
  .steps { font-size:14px; }
  .steps li { margin-bottom:8px; }
  button { width:100%; padding:12px; border:none; border-radius:12px; background:#e8b830; color:#3a3222; font-size:15px; font-weight:700; cursor:pointer; }
  .note { font-size:12px; color:#8a7d5e; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 독서 트래커 저장소 진단</h1>
  <div id="verdict" class="verdict">검사 중...</div>
  <div class="card" id="rows"></div>
  <div class="card steps">
    <b>검사 방법</b>
    <ol>
      <li>이 페이지를 <b>새로고침</b> 해보세요 → "방문 횟수"가 2, 3...으로 올라가야 정상이에요.</li>
      <li>크롬을 <b>완전히 닫았다가</b> 다시 열어 이 페이지에 와보세요 → "처음 기록 시각"이 그대로면 정상, 방문 횟수가 1로 돌아가면 크롬이 종료할 때 데이터를 지우고 있는 거예요.</li>
      <li>아래 버튼으로 결과를 복사해서 보내주세요 (스크린샷도 좋아요).</li>
    </ol>
  </div>
  <button id="copyBtn">📋 검사 결과 복사하기</button>
  <div class="note">이 페이지는 아무 데이터도 외부로 보내지 않아요. 결과는 복사 버튼을 눌러 직접 보내주실 때만 전달됩니다.</div>
</div>
<script>
(function() {
  var R = { time: new Date().toLocaleString('ko-KR') };

  // 1) 저장 기능 자체가 동작하는지
  R.canWrite = false; R.writeErr = '';
  try {
    localStorage.setItem('pt_diag_probe', '1');
    R.canWrite = localStorage.getItem('pt_diag_probe') === '1';
    localStorage.removeItem('pt_diag_probe');
  } catch (e) { R.writeErr = (e && (e.name + ': ' + e.message)) || String(e); }

  // 2) 방문 카운트 (새로고침/재시작 생존 여부)
  var diag = null;
  try { diag = JSON.parse(localStorage.getItem('pt_diag_v1')); } catch (e) {}
  if (!diag || typeof diag.count !== 'number') diag = { first: Date.now(), count: 0 };
  diag.count++; diag.last = Date.now();
  try { localStorage.setItem('pt_diag_v1', JSON.stringify(diag)); } catch (e) {}
  R.count = diag.count;
  R.first = new Date(diag.first).toLocaleString('ko-KR');

  // 3) 트래커 데이터가 지금 이 브라우저에 있는지
  R.tracker = '없음';
  try {
    var raw = localStorage.getItem('pt_v6_data');
    var gz = localStorage.getItem('pt_v6_data_gz');
    var bak = localStorage.getItem('pt_v6_data_bak');
    if (raw) {
      var d = JSON.parse(raw);
      var tabs = (d && d.tabs) || [];
      var arts = 0, reads = 0;
      tabs.forEach(function(t) {
        arts += (t.articles || []).length;
        var m = t.readMap || {}; for (var k in m) if (m[k]) reads++;
      });
      R.tracker = '탭 ' + tabs.length + '개 · 항목 ' + arts + '개 · 읽음 ' + reads + '개';
    } else if (gz) { R.tracker = '압축 저장본 있음'; }
    if (bak) R.tracker += ' (+자동백업 있음)';
  } catch (e) { R.tracker = '읽기 실패: ' + ((e && e.name) || e); }

  // 4) 영구 저장 여부 / 브라우저 정보
  R.persisted = '확인 불가'; R.ua = navigator.userAgent; R.cookies = navigator.cookieEnabled ? '허용' : '차단됨';
  try {
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(function(p) { R.persisted = p ? '영구 보장됨' : '브라우저 재량(일반)'; render(); });
    }
  } catch (e) {}

  function verdict() {
    if (!R.canWrite) {
      return { cls: 'bad', msg: '❌ 이 브라우저는 사이트 데이터 저장이 차단되어 있어요',
        sub: '크롬 설정 → 개인 정보 보호 및 보안 → 사이트 설정(또는 서드 파티 쿠키) → "기기 내 사이트 데이터"에서 "사이트가 기기에 데이터를 저장할 수 있음"을 선택해 주세요. 쿠키/기록 자동 삭제 확장프로그램이 있다면 꺼주세요. (오류: ' + (R.writeErr || '값이 저장되지 않음') + ')' };
    }
    if (R.count === 1) {
      return { cls: 'wait', msg: '🔄 저장은 되고 있어요 — 이제 새로고침을 한 번 해주세요',
        sub: '새로고침 후 "방문 횟수"가 2가 되면 1단계 통과예요.' };
    }
    return { cls: 'ok', msg: '✅ 새로고침 후에도 저장이 유지되고 있어요 (방문 ' + R.count + '회)',
      sub: '이제 크롬을 완전히 닫았다가 다시 열어 이 페이지에 와보세요. 방문 횟수가 이어지면 정상이고, 1로 돌아가면 "창을 닫을 때 데이터 삭제" 설정이나 정리 프로그램이 지우는 거예요.' };
  }

  function render() {
    var v = verdict();
    var el = document.getElementById('verdict');
    el.className = 'verdict ' + v.cls;
    el.innerHTML = v.msg + '<span class="sub">' + v.sub + '</span>';
    var rows = [
      ['저장 기능', R.canWrite ? '정상 ✅' : '차단됨 ❌'],
      ['방문 횟수', R.count + '회'],
      ['처음 기록 시각', R.first],
      ['트래커 데이터', R.tracker],
      ['영구 저장', R.persisted],
      ['쿠키', R.cookies],
      ['검사 시각', R.time]
    ];
    document.getElementById('rows').innerHTML = rows.map(function(r) {
      return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
    }).join('');
  }
  render();

  document.getElementById('copyBtn').addEventListener('click', function() {
    var txt = '📦 독서 트래커 저장소 진단 결과\n' +
      '- 저장 기능: ' + (R.canWrite ? '정상' : '차단됨 (' + R.writeErr + ')') + '\n' +
      '- 방문 횟수: ' + R.count + '회 / 처음 기록: ' + R.first + '\n' +
      '- 트래커 데이터: ' + R.tracker + '\n' +
      '- 영구 저장: ' + R.persisted + ' / 쿠키: ' + R.cookies + '\n' +
      '- 검사 시각: ' + R.time + '\n' +
      '- 브라우저: ' + R.ua;
    function done(ok) {
      var b = document.getElementById('copyBtn');
      b.textContent = ok ? '✅ 복사됐어요! 붙여넣어 보내주세요' : '복사 실패 — 화면을 스크린샷해 주세요';
      setTimeout(function() { b.textContent = '📋 검사 결과 복사하기'; }, 2500);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function() { done(true); }, function() { done(false); });
      } else {
        var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
        ta.select(); var ok = document.execCommand('copy'); document.body.removeChild(ta); done(ok);
      }
    } catch (e) { done(false); }
  });
})();
</script>
</body>
</html>
